# VillagerWorkers settings

# ---- Settlements ----
# Right-click a bell to create a settlement there. Everything happens within this radius of the bell.
max-settlements-per-player: 1
settlement-radius: 48
max-settlers-per-settlement: 10

# Can settlers use chests and barrels in the settlement unless you switch them off with the ledger?
chests-allowed-by-default: true

# Price to recruit a new settler at the bell (item:amount), by how many settlers already live there:
# from 0 settlers the first list, from 3 the second, and so on. (A plain list also works: then every
# settler costs recruit-cost-increase % more than the one before.)
recruit-cost:
  0: [emerald:3, bread:10]
  3: [emerald:6, cooked_beef:12]
  6: [emerald:10, golden_carrot:8]
  10: [emerald:16, cake:2]
  15: [emerald:24, golden_apple:2]
recruit-cost-increase: 20

# Particles for the settlement border and work areas (Show border). Any particle without extra
# data works, e.g. SOUL_FIRE_FLAME (blue), HAPPY_VILLAGER (green), FLAME, SMALL_FLAME, END_ROD, HAPPY_VILLAGER, COMPOSTER, WAX_ON,
# ELECTRIC_SPARK, GLOW, CRIT. Resource packs can change how they look.
border-particle: SOUL_FIRE_FLAME
work-area-particle: HAPPY_VILLAGER

# ---- Settlers ----
# Show the job above each settler and what it is doing under it.
show-names: true

# Walking speed in blocks per tick (20 ticks = 1 second). A player walks 0.21.
work-speed: 0.15
walk-speed: 0.11

# Work area radius around a workplace (composter): default for new workplaces, and the maximum.
default-work-radius: 6
max-work-radius: 12
# How far from the bell settlers wander in their free time.
social-radius: 16

# Settlers stop working at night and get together at a gathering spot (the place with the
# most seats close together: stairs, slabs, cushions). Without seats they meet at the bell.
work-at-night: false

# ---- Defense ----
# Guards (and settlers called to arms) take weapons, armor, arrows and potions only from chests
# settlers may take from. Arrows a guard carries (refilled after a fight; archers when they run out).
arrows-to-carry: 32
# Default radius a defensive guard protects around its post.
guard-radius: 16
# Settlers heal 1 health point every this many seconds when not fighting.
regen-seconds: 4
# Below this health (in %) settlers eat food from storage (if allowed in the ledger). Guards eat first.
eat-below-health-percent: 60

# Height of sitting settlers relative to the top of the seat (raise if they sink in).
sit-height: 0.0

# Settler skins, picked at random. Built-in skins: steve, alex, ari, efe, kai, makena, noor,
# sunny, zuri. Use "player:Name" for a real player's skin, or "texture:namespace:path/to/skin" (add ":slim"
# for slim arms) for your own skin image in the server resource pack (assets/namespace/textures/path/to/skin.png).
skins: [steve, alex, ari, efe, kai, makena, noor, sunny, zuri]

# Skins per job (a settler gets one of these while it has that job; empty or missing = its own skin).
# Jobs: farmer, cook, smelter, furnace-worker, herder, lumberjack, smith, guard, settler (no job).
# A skin can be:
#   url:http://textures.minecraft.net/texture/<id>        (add :slim for slim arms)
#   value:<texture value>                                  (the long "value" from mineskin.org)
#   texture:namespace:path/to/skin                         (a skin image in your server resource pack)
#   player:Name                                            (a player's current skin)
# To use a skin image from a skin website: upload it at mineskin.org and copy the texture URL or value.
job-skins:
  farmer: []
  cook: []
  smelter: []
  furnace-worker: []
  herder: []
  lumberjack: []
  smith: []
  guard: []

# Farmers keep this many of each seed (seeds, carrots, potatoes, beetroot seeds) for replanting.
seeds-to-keep: 16

# Names that fit the skin: men's names for men's skins, women's names for women's skins.
names-male: [Bram, Cor, Daan, Finn, Gijs, Hugo, Jens, Joep, Kees, Lars, Otto, Rik, Sem, Teun, Thijs, Wim]
names-female: [Anna, Eva, Femke, Fleur, Greet, Ilse, Lieke, Lotte, Maud, Noor, Pien, Roos, Saar, Sanne, Vera, Yara]
# Which built-in skins are men and which are women (decides the name and slim/wide arms).
skin-gender:
  steve: male
  alex: female
  ari: female
  efe: female
  kai: male
  makena: female
  noor: female
  sunny: male
  zuri: male

# Names for skins that are neither (a player's skin, your own skins).
names: [Anna, Bram, Cor, Daan, Eva, Finn, Greet, Hugo, Ilse, Joep, Kees, Lotte, Maud, Noor, Otto, Pien, Rik, Saar, Teun, Vera, Wim, Yara]

# Sounds when settlers talk: a mumbling voice (each settler its own pitch), and a laugh.
talk-sounds: true
voice-sound: minecraft:entity.villager.ambient
laugh-sound: minecraft:entity.villager.yes

# Things settlers say when sitting together in the evening. Their conversations (little stories
# for 2 or 3 settlers) are built in; add your own in my-conversations.yml.
chat-lines:
  - "Nice weather today!"
  - "Did you see the crops?"
  - "Hmm..."
  - "I heard a zombie last night."
  - "Busy day, busy day."
  - "Haha!"
  - "Really?"
  - "My back hurts from all that farming."
  - "Have you met the new guy?"
  - "I could use a nap."
  - "The emeralds aren't what they used to be."
  - "Look at that!"
  - "Mhm, mhm."
  - "I love carrots."
  - "Where's my hoe?"
  - "Rain soon, I can feel it."
  - "Hrrm."
  - "No way!"
  - "That's what I said!"
  - "Let's grab some bread later."
