      - "1: A spider jockey! Scary."
      - "2: I don't believe it."
      - "0: They were shaking all day."
      - "2: They shake when they drink coffee too."
      - "1: We don't have coffee."
      - "2: Exactly. Suspicious."

  - people: 3
    lines:
      - "0: Okay, vote: should {town} get a fountain?"
      - "1: Yes!"
      - "2: Who's going to build it?"
      - "1: ...you?"
      - "2: I vote no."
      - "0: One yes, one no. I'll ask {owner}."

  - people: 3
    lines:
      - "0: I bet I can carry more {item} than you two."
      - "1: You're on."
      - "2: Count me in."
      - "0: Loser cleans the chests."
      - "1: Wait, how many are there?"
      - "2: {count}."
      - "1: ...I suddenly feel tired."

  - people: 3
    lines:
      - "0: Story time! Once upon a time, there was a brave {job0}."
      - "1: Was it you?"
      - "0: ...maybe. Anyway, one night a creeper came."
      - "2: Oh no."
      - "0: And I said: not in MY settlement!"
      - "1: And then?"
      - "0: Then I ran. Very bravely."
      - "2: Classic."

  - people: 3
    lines:
      - "0: What's the best job in {town}?"
      - "1: {job1}, obviously."
      - "2: No way, {job2} is the best."
      - "0: You're both wrong."
      - "1: Then what is it?"
      - "0: The one with the most breaks."
      - "2: Fair."

  - people: 3
    lines:
      - "0: Shh. Listen."
      - "1: What is it?"
      - "0: ...nothing. That's the point. It's peaceful."
      - "2: You scared me for nothing!"
      - "0: For peace. Not for nothing."
      - "1: Deep."

  - people: 3
    lines:
