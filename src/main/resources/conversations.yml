# The built-in conversations (always loaded from the plugin). Add your own in my-conversations.yml.
# Each one is for 2 or 3 settlers.
# A line starts with who says it (0, 1 or 2), then a colon.
# Placeholders: {0} {1} {2} = the names of the settlers talking, {job0} {job1} {job2} = their jobs,
# {other} = another settler of the settlement, {town} = the settlement, {owner} = its owner,
# {item} and {count} = something in storage and how much of it there is.

conversations:
  - people: 2
    lines:
      - "0: Morning, {1}! Sleep well?"
      - "1: Like a log. Until the rooster started."
      - "0: We don't have a rooster."
      - "1: ...then who was that?"
      - "0: I think it was {other}. Singing."
      - "1: Oh no."

  - people: 2
    lines:
      - "0: Did you count the {item} lately?"
      - "1: {count}, last time I looked."
      - "0: {count}! That's a lot of {item}."
      - "1: {owner} says we can never have too much."
      - "0: {owner} hasn't tried carrying it all."

  - people: 2
    lines:
      - "0: I had the strangest dream last night."
      - "1: Let me guess. Creepers?"
      - "0: No! I was the boss of {town}."
      - "1: And?"
      - "0: Everyone had to do MY job for a day."
      - "1: Sounds like a nightmare to me."

  - people: 2
    lines:
      - "0: How's work, {1}?"
      - "1: Busy. Being a {job1} is no joke."
      - "0: I could never do that."
      - "1: Sure you could. You just need patience."
      - "0: And a nap."
      - "1: Mostly a nap."

  - people: 2
    lines:
      - "0: Psst. {1}. Can you keep a secret?"
      - "1: Of course!"
      - "0: I hid a cookie behind the chests."
      - "1: Which chests?"
      - "0: ...I don't remember."
      - "1: Then it's not a secret, it's lost."

  - people: 2
    lines:
      - "0: Have you seen {other} lately?"
      - "1: Working hard, as always."
      - "0: Or hardly working!"
      - "1: Ha! Don't let them hear that."
      - "0: Too late, they're right behind you."
      - "1: ...very funny."

  - people: 2
    lines:
      - "0: I heard zombies near the edge of {town} last night."
      - "1: The guards will handle them."
      - "0: What if they don't?"
      - "1: Then you run. Fast."
      - "0: Great plan."
      - "1: Worked so far!"

  - people: 2
    lines:
      - "0: What would you do with a diamond, {1}?"
      - "1: Make a pickaxe. Obviously."
      - "0: Boring! I'd make a ring."
      - "1: A diamond ring? For whom?"
      - "0: ...nobody. Forget I said that."
      - "1: Hmm hm hm."

  - people: 2
    lines:
      - "0: Rain's coming. I can feel it in my knees."
      - "1: Your knees said that last week too."
      - "0: And it rained!"
      - "1: Three days later."
      - "0: My knees are patient."

  - people: 2
    lines:
      - "0: {1}, do you ever miss the old village?"
      - "1: Sometimes. The bread was better."
      - "0: The bread was terrible!"
      - "1: Yes, but it was OUR terrible bread."
      - "0: ...I do miss that bread."

  - people: 2
    lines:
      - "0: I'm going to build a tower one day."
      - "1: How high?"
      - "0: Higher than the clouds!"
      - "1: You're scared of ladders."
      - "0: Then I'll build stairs."
      - "1: That's a lot of stairs."

  - people: 2
    lines:
      - "0: {owner} gave me a nod today."
      - "1: A nod? Like this?"
      - "0: No, more like... a proud nod."
      - "1: Wow. Maybe you'll get a raise."
      - "0: In what? Emeralds?"
      - "1: In nods. Two nods."

  - people: 2
    lines:
      - "0: Do you think the chickens know?"
      - "1: Know what?"
      - "0: Anything."
      - "1: ...I think they know more than they let on."
      - "0: That's what worries me."

  - people: 2
    lines:
      - "0: What's your favourite food, {1}?"
      - "1: Pumpkin pie. No question."
      - "0: Mine's baked potato."
      - "1: That's not a favourite, that's a side dish."
      - "0: It's a lifestyle."

  - people: 3
    lines:
