name: Settlement
version: 1.0.0
main: settlement.SettlementPlugin
api-version: '1.21'
softdepend: [packetevents]
description: A settlement at a bell with settlers who work and live their own lives.
permissions:
  settlement.admin:
    description: Manage any settlement, open private chests, ignore the limits.
    default: op
commands:
  settlers:
    description: Settler diagnostics. Look at a settler and type /settlers info
    usage: /settlers info
